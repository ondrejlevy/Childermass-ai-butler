name: "CodeQL Security Analysis"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run every Monday at 6:00 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze Python Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Initialize CodeQL
      uses: github/codeql-action/init@17ec405481c24be464d4b2c5727a82f700ddb189 # v3.32.3
      with:
        languages: ${{ matrix.language }}
        queries: +security-extended,security-and-quality
        config: |
          paths-ignore:
            - '**/__pycache__'
            - '**/tests'
            - '**/*.pyc'

    - name: Autobuild
      uses: github/codeql-action/autobuild@17ec405481c24be464d4b2c5727a82f700ddb189 # v3.32.3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@17ec405481c24be464d4b2c5727a82f700ddb189 # v3.32.3
      with:
        category: "/language:${{matrix.language}}"
        upload: true
