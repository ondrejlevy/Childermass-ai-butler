name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ===========================================================================
  # Code Quality & Linting
  # ===========================================================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort

      - name: Run Ruff check
        run: |
          ruff check src/ --output-format=github

      - name: Run Ruff format check
        run: |
          ruff format --check src/

      - name: Check with Black
        run: |
          black --check src/

      - name: Check imports with isort
        run: |
          isort --check-only --profile black src/

  # ===========================================================================
  # Type Checking
  # ===========================================================================
  type-check:
    name: Type Check with MyPy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          # Install all MCP server dependencies
          for req in src/childermass/*/requirements.txt; do
            echo "Installing dependencies from $req"
            pip install -r "$req" || true
          done

      - name: Run MyPy
        run: |
          mypy src/ --ignore-missing-imports --no-strict-optional

  # ===========================================================================
  # Security Auditing
  # ===========================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit safety

      - name: Run pip-audit
        run: |
          for req in src/childermass/*/requirements.txt; do
            echo "Auditing $req"
            pip-audit -r "$req" || true
          done

      - name: Run Bandit (security linter)
        run: |
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ -f txt

      - name: Run Safety check
        run: |
          for req in src/childermass/*/requirements.txt; do
            echo "Safety check for $req"
            safety check -r "$req" --json || true
          done

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json

  # ===========================================================================
  # Testing - Matrix for all MCP servers
  # ===========================================================================
  test:
    name: Test ${{ matrix.mcp-server }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp-server:
          - calendar_mcp
          - contacts_mcp
          - gmail_mcp
          - keep_mcp
          - mapy_mcp
          - memory_mcp
          - network_mcp
          - places_mcp
          - protect_mcp
          - tasks_mcp
          - weather_mcp
    
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies for ${{ matrix.mcp-server }}
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio pytest-mock
          if [ -f src/childermass/${{ matrix.mcp-server }}/requirements.txt ]; then
            pip install -r src/childermass/${{ matrix.mcp-server }}/requirements.txt
          fi

      - name: Run tests for ${{ matrix.mcp-server }}
        run: |
          cd src/childermass/${{ matrix.mcp-server }}
          if [ -d tests ]; then
            pytest tests/ \
              --verbose \
              --cov=. \
              --cov-report=xml \
              --cov-report=term \
              --cov-report=html \
              --junitxml=junit.xml
          else
            echo "No tests directory found for ${{ matrix.mcp-server }}"
          fi

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          file: src/childermass/${{ matrix.mcp-server }}/coverage.xml
          flags: ${{ matrix.mcp-server }}
          name: ${{ matrix.mcp-server }}-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.mcp-server }}
          path: |
            src/childermass/${{ matrix.mcp-server }}/junit.xml
            src/childermass/${{ matrix.mcp-server }}/htmlcov/

  # ===========================================================================
  # Combined Coverage Report
  # ===========================================================================
  coverage:
    name: Generate Combined Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install coverage tools
        run: |
          pip install coverage

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: test-results-*
          path: coverage-reports/

      - name: Generate combined coverage report
        run: |
          coverage combine coverage-reports/*/.coverage || true
          coverage report || true
          coverage html -d htmlcov-combined || true

      - name: Upload combined coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-coverage-report
          path: htmlcov-combined/

  # ===========================================================================
  # Dependency Review (for PRs only)
  # ===========================================================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  # ===========================================================================
  # Final Status Check
  # ===========================================================================
  ci-success:
    name: CI Pipeline Success
    runs-on: ubuntu-latest
    needs: [lint, type-check, security, test]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.lint.result }}" == "success" ]] && \
             [[ "${{ needs.type-check.result }}" == "success" ]] && \
             [[ "${{ needs.security.result }}" == "success" ]] && \
             [[ "${{ needs.test.result }}" == "success" ]]; then
            echo "✅ All CI checks passed!"
            exit 0
          else
            echo "❌ Some CI checks failed"
            exit 1
          fi
