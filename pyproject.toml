[project]
name = "childermass"
version = "0.1.0"
description = "Personal Home Assistant Agent built on Model Context Protocol"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [
    {name = "Ondřej Levy"}
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# ===========================================================================
# Black Configuration
# ===========================================================================
[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
  | venv
  | build
  | dist
)/
'''

# ===========================================================================
# isort Configuration
# ===========================================================================
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
split_on_trailing_comma = true
known_first_party = ["childermass"]

# ===========================================================================
# MyPy Configuration
# ===========================================================================
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = false  # Disable unreachable warnings (false positives after raise)
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "*.tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "*.security"
# Security modules have unreachable code after raise statements (by design)
disable_error_code = ["unreachable"]

[[tool.mypy.overrides]]
module = "*.auth"
# Auth modules may return Any from external APIs
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = "*.client"
# Client modules may return Any from external APIs
disable_error_code = ["no-any-return"]

# ===========================================================================
# Pytest Configuration
# ===========================================================================
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--strict-config",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "unit: marks unit tests",
    "security: marks security-related tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

# ===========================================================================
# Coverage Configuration
# ===========================================================================
[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/setup.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# ===========================================================================
# Bandit Configuration
# ===========================================================================
[tool.bandit]
exclude_dirs = [
    "/tests/",
    "/.venv/",
    "/venv/",
]
skips = [
    "B101",  # assert_used (OK in tests)
    "B601",  # paramiko_calls
]

# ===========================================================================
# Ruff-specific Configuration (extends ruff.toml)
# ===========================================================================
[tool.ruff]
extend = "ruff.toml"
