# Ruff Configuration for Childermass Project
# https://docs.astral.sh/ruff/

# ===========================================================================
# General Settings
# ===========================================================================
target-version = "py312"
line-length = 100
indent-width = 4

# ===========================================================================
# File Selection
# ===========================================================================
extend-exclude = [
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
]

# ===========================================================================
# Linting Rules
# ===========================================================================
[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "G",      # flake8-logging-format
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # pylint
    "TRY",    # tryceratops
    "FLY",    # flynt
    "PERF",   # perflint
    "RUF",    # ruff-specific rules
    "S",      # bandit (security)
]

ignore = [
    "E501",    # line too long (handled by formatter)
    "PLR0913", # too many arguments
    "TRY003",  # avoid long messages outside exception class
    "S101",    # use of assert (OK in tests)
    "S105",    # possible hardcoded password (too many false positives)
    "S106",    # possible hardcoded password (too many false positives)
    "PLW0603", # global statement (used intentionally for singletons)
    "PLW0602", # global without assignment (used for type checking)
    "PTH123",  # Path.open() vs open() (both are acceptable)
    "PTH101",  # Path.chmod() vs os.chmod() (both are acceptable)
    "RUF001",  # unicode chars in strings (×, – are intentional)
    "RUF002",  # unicode chars in docstrings (EN DASH is OK)
    "RUF003",  # unicode chars in comments (EN DASH is OK)
    "PLR0912", # too many branches (acceptable in business logic)
    "PLR0915", # too many statements (acceptable in business logic)
    "PLR2004", # magic values (acceptable for business constants)
    "DTZ",     # datetime timezone (handled by external APIs)
    "SIM102",  # nested if (sometimes more readable)
]

# ===========================================================================
# Per-file Ignores
# ===========================================================================
[lint.per-file-ignores]
"**/tests/**/*.py" = [
    "S101",    # allow assert in tests
    "S110",    # allow try-except-pass in tests
    "ARG",     # allow unused arguments in test fixtures
    "PLR2004", # allow magic values in tests
    "PLC0415", # allow imports in functions (for test isolation)
    "PT012",   # allow complex pytest.raises blocks
    "SLF001",  # allow private member access (testing internals)
    "RUF043",  # allow unescaped regex in pytest.raises match
    "SIM105",  # allow try-except-pass in tests
]
"__init__.py" = [
    "F401",    # allow unused imports in __init__.py
    "PLC0415", # allow conditional imports
]
"**/auth.py" = [
    "PLC0415", # late imports for optional dependencies (keyring)
    "S110",    # try-except-pass for optional features
    "T201",    # print() used for CLI output
    "TRY300",  # complex auth logic in try blocks
    "TRY401",  # redundant exception in logging (intentional for clarity)
]
"**/security.py" = [
    "S110",    # try-except-pass in audit logging (must not crash)
    "SIM105",  # contextlib.suppress not always better
    "PLC0415", # lazy imports (RotatingFileHandler)
    "PLW2901", # loop variable overwrite (sanitization logic)
    "RUF012",  # mutable class attribute (intended for defaults)
]
"**/client.py" = [
    "TRY300",  # complex business logic in try blocks (acceptable pattern)
    "TRY301",  # abstract raise (not always applicable)
    "TRY004",  # prefer TypeError (SecurityError is more specific)
    "B904",    # raise from (not always needed for API errors)
    "PLW2901", # loop variable overwrite (data transformation)
    "PERF401", # list comprehension (readability over performance)
    "ERA001",  # commented code (debugging/documentation)
]
"**/carriers/**/*.py" = [
    "ARG002",  # unused method arguments (required by abstract interface)
    "PLR0911", # too many return statements (status mapping logic)
    "RUF012",  # mutable class attributes (class-level pattern lists)
]
"**/server.py" = [
    "TRY300",  # complex MCP handler logic in try blocks (acceptable pattern)
    "B904",    # raise from (not always needed for MCP errors)
    "PLC0415", # conditional imports (MCP tools)
    "PLW2901", # loop variable overwrite (data transformation)
    "SLF001",  # private member access (framework internals)
    "ARG001",  # unused arguments (MCP tool signatures)
    "DTZ",     # timezone handling (handled by external APIs)
]

# ===========================================================================
# Plugin Configurations
# ===========================================================================
[lint.isort]
known-first-party = ["childermass"]
force-single-line = false
lines-after-imports = 2

[lint.mccabe]
max-complexity = 10

[lint.pydocstyle]
convention = "google"

# ===========================================================================
# Formatting
# ===========================================================================
[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
